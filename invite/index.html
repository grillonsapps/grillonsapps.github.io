<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation ami — MoveToUnlock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A1A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #12122A;
      border: 1px solid #1E1E3A;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(29, 185, 84, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .username {
      color: #1DB954;
      font-weight: 700;
    }
    p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #1DB954;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background: transparent;
      color: rgba(255,255,255,0.5);
      border: 1px solid #2A2A4A;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    #error-msg {
      display: none;
      color: #E94560;
      font-size: 13px;
      margin-top: 16px;
    }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128101;</div>
    <h1>Invitation d'ami</h1>
    <p id="desc">Ouvre MoveToUnlock pour accepter la demande d'ami.</p>

    <button class="btn-primary" onclick="openApp()">Ouvrir MoveToUnlock</button>
    <a class="btn-secondary"
       href="https://play.google.com/store/apps/details?id=com.pompelock.app"
       target="_blank">
      T&#233;l&#233;charger l'app
    </a>

    <div id="error-msg">L'app n'est pas install&#233;e ou le lien a expir&#233;.</div>
    <div class="status" id="status-text"></div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var u = params.get('u');
    var h = params.get('h');

    if (u) {
      var tag = u + (h ? '#' + h : '');
      document.getElementById('desc').innerHTML =
        '<span class="username">' + tag + '</span> t\'invite sur MoveToUnlock.<br>Ouvre l\'app pour accepter.';
    }

    function openApp() {
      if (!id) {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('error-msg').textContent = 'Lien invalide ou expiré.';
        return;
      }
      // Custom scheme — ouvre l'app directement
      var appUrl = 'movetounlockapp://invite?id=' + encodeURIComponent(id);
      window.location.href = appUrl;

      setTimeout(function() {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('status-text').textContent =
          "Si l'app ne s'ouvre pas, vérifie qu'elle est installée.";
      }, 2000);
    }

    if (id) {
      document.getElementById('status-text').textContent = "Ouverture de l'app…";
      setTimeout(openApp, 600);
    } else {
      document.getElementById('error-msg').textContent = 'Lien invalide ou expiré.';
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
